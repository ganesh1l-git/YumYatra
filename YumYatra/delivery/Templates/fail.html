{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YumYatra - Authentication Failed</title>
    <link rel="stylesheet" href="{% static 'premium.css' %}">
</head>
<body style="background: #f8f9fa;">
    <div class="app-container" style="display: flex; align-items: center; justify-content: center; min-height: 80vh;">
        <div class="card" style="max-width: 440px; text-align: center; padding: 35px 28px; box-shadow: var(--shadow-md);">
            <div style="font-size: 3rem; margin-bottom: 12px;">🔒</div>
            <h1 style="margin-bottom: 8px; font-size: 1.5rem;">Authentication Failed</h1>
            <p style="color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5; margin-bottom: 22px;">
                Invalid credentials provided or session expired. Please verify your username and password.
            </p>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <a href="{% url 'open_signin' %}" class="btn" style="padding: 11px 20px; font-size: 0.92rem; border-radius: 8px;">Try Signing In Again</a>
                <a href="{% url 'say_hello' %}" style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 8px;">&larr; Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
