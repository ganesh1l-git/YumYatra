{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YumYatra - Authentication Failed</title>
    <link rel="stylesheet" href="{% static 'premium.css' %}">
</head>
<body>
    <div class="app-container" style="display: flex; align-items: center; justify-content: center; min-height: 80vh;">
        <div class="card" style="max-width: 480px; text-align: center; padding: 40px 30px;">
            <div style="font-size: 3.5rem; margin-bottom: 15px;">🔒</div>
            <h2 style="margin-bottom: 10px; font-size: 1.8rem;">Authentication Failed</h2>
            <p style="color: var(--text-secondary); font-size: 0.95rem; line-height: 1.5; margin-bottom: 25px;">
                Invalid credentials provided or session expired. Please verify your username/password and try again.
            </p>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <a href="{% url 'open_signin' %}" class="btn" style="padding: 12px 24px; text-decoration: none;">Try Signing In Again</a>
                <a href="{% url 'say_hello' %}" style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 10px;">Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
